<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>tagoplus Admin 기획</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="tagoplus 쇼핑몰 관리자 전체 메뉴를 담은 기획서 겸 클릭 가능한 HTML 프로토타입">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* tagoplus Admin 톤: 스카이블루 + 그린 플러스 + 라이트 사이드바 / 클릭 인터랙션(모달·토스트) 포함 */
:root{
  --bg:#ecf0f5; --surface:#ffffff; --surface-2:#f6f8fb; --surface-3:#eef2f7;
  --border:#dde3ec; --border-strong:#c7d0dc;
  --fg:#2a333f; --fg-2:#44515f; --muted:#79838f; --faint:#9aa4b0;
  --pri:#3c8dbc; --pri-d:#357aa5; --pri-fg:#ffffff; --pri-weak:#e5f1f8; --pri-weak-fg:#2a6c92;
  --leaf:#5aa85f; --brand:#e8542f;
  --ok:#2f9e52; --ok-bg:#e3f5e8; --warn:#b47d12; --warn-bg:#f8efd7;
  --danger:#d64a3f; --danger-bg:#fce5e2; --info:#3c8dbc; --info-bg:#e5f1f8;
  --sb-bg:#ffffff; --sb-bg-2:#f6f8fb; --sb-fg:#4a545f; --sb-muted:#97a1ac;
  --sb-head:#aab3bf; --sb-active-bg:#e7f2f9; --sb-active-fg:#2d7aa6; --sb-hover:#f1f6fa;
  --shadow:0 1px 2px rgba(30,45,70,.05),0 2px 8px rgba(30,45,70,.05);
  --radius:9px; --radius-s:7px;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1420; --surface:#161e2b; --surface-2:#1b2432; --surface-3:#212b3b;
  --border:#2a3444; --border-strong:#3a4659;
  --fg:#e6ecf4; --fg-2:#bcc7d5; --muted:#8c97a6; --faint:#657182;
  --pri:#55a1d1; --pri-d:#6bb0dd; --pri-fg:#07131c; --pri-weak:#15293a; --pri-weak-fg:#a4d2ee;
  --leaf:#6cbd72; --brand:#f3744f;
  --ok:#43cf7f; --ok-bg:#15301f; --warn:#e0b159; --warn-bg:#33290f;
  --danger:#f0756b; --danger-bg:#381a18; --info:#55a1d1; --info-bg:#122636;
  --sb-bg:#0e1b28; --sb-bg-2:#0a1420; --sb-fg:#c0cbd7; --sb-muted:#7e8a98;
  --sb-head:#69747f; --sb-active-bg:#12324a; --sb-active-fg:#cfe6f5; --sb-hover:#132333;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 2px 10px rgba(0,0,0,.3);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0d1420; --surface:#161e2b; --surface-2:#1b2432; --surface-3:#212b3b;
  --border:#2a3444; --border-strong:#3a4659;
  --fg:#e6ecf4; --fg-2:#bcc7d5; --muted:#8c97a6; --faint:#657182;
  --pri:#55a1d1; --pri-d:#6bb0dd; --pri-fg:#07131c; --pri-weak:#15293a; --pri-weak-fg:#a4d2ee;
  --leaf:#6cbd72; --brand:#f3744f;
  --ok:#43cf7f; --ok-bg:#15301f; --warn:#e0b159; --warn-bg:#33290f;
  --danger:#f0756b; --danger-bg:#381a18; --info:#55a1d1; --info-bg:#122636;
  --sb-bg:#0e1b28; --sb-bg-2:#0a1420; --sb-fg:#c0cbd7; --sb-muted:#7e8a98;
  --sb-head:#69747f; --sb-active-bg:#12324a; --sb-active-fg:#cfe6f5; --sb-hover:#132333;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 2px 10px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-weight:700}
a{color:inherit}
button{font-family:inherit;cursor:pointer}
.tnum{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}

/* ---- shell ---- */
.app{display:flex;flex-direction:column;min-height:100%}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;background:var(--surface);color:var(--fg);
  height:56px;border-bottom:1px solid var(--border);box-shadow:var(--shadow);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:17px;letter-spacing:-.4px;white-space:nowrap}
.brand .logo{display:inline-flex;align-items:center}
.brand .logo svg{display:block}
.brand .adm{color:var(--pri);font-weight:700;font-size:12px;font-family:var(--mono);align-self:center}
.qicks{display:flex;gap:6px;margin-left:6px}
.qick{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;border:0;color:#fff;opacity:.95}
.qick:hover{opacity:1;transform:translateY(-1px)}
.qick svg{width:16px;height:16px}
.top-sp{flex:1}
.top-btn{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border-strong);
  color:var(--fg-2);height:32px;padding:0 11px;border-radius:7px;font-size:12.5px}
.top-btn:hover{border-color:var(--pri);color:var(--pri)}
.top-user{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--fg);font-weight:500}
.top-user .av{width:28px;height:28px;border-radius:50%;background:var(--pri);display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px}
.bell{position:relative;color:var(--fg-2)}
.bell .b{position:absolute;top:-5px;right:-6px;background:var(--brand);color:#fff;font-size:9px;border-radius:999px;padding:0 4px;font-weight:700}
.hamb{display:none;background:transparent;border:0;color:var(--fg);padding:4px}
.layout{flex:1;display:flex;min-height:0}

/* ---- sidebar ---- */
.sidebar{width:244px;flex:none;background:var(--sb-bg);color:var(--sb-fg);border-right:1px solid var(--border);overflow-y:auto;padding:8px 0 44px}
.sidebar::-webkit-scrollbar{width:8px}.sidebar::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px}
.nav-single,.nav-head{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:transparent;border:0;color:var(--sb-fg);padding:11px 16px;font-size:13.5px;font-weight:500}
.nav-head{justify-content:space-between}
.nav-head .hl{display:flex;align-items:center;gap:11px}
.nav-single:hover,.nav-head:hover{background:var(--sb-hover)}
.nav-single.active{background:var(--sb-active-bg);color:var(--sb-active-fg);font-weight:700;box-shadow:inset 3px 0 0 var(--pri)}
.ico{width:18px;height:18px;flex:none;color:var(--sb-muted)}
.nav-single.active .ico{color:var(--pri)}
.caret{width:13px;height:13px;transition:transform .18s;color:var(--sb-muted)}
.nav-group.open .caret{transform:rotate(90deg)}
.submenu{display:none;background:var(--sb-bg-2);padding:4px 0 6px}
.nav-group.open .submenu{display:block}
.sub-item{display:block;width:100%;text-align:left;background:transparent;border:0;color:var(--sb-fg);padding:8px 16px 8px 46px;font-size:12.7px;position:relative}
.sub-item:hover{background:var(--sb-hover);color:var(--fg)}
.sub-item.active{color:var(--pri);font-weight:700}
.sub-item.active::before{content:"";position:absolute;left:31px;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:var(--pri)}
.sub-label{padding:9px 16px 5px 24px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--sb-head);font-weight:700}
.scrim{display:none}

/* ---- main ---- */
.main{flex:1;min-width:0;overflow-x:hidden;padding:22px max(16px,env(safe-area-inset-right,0px)) 64px max(16px,env(safe-area-inset-left,0px))}
.main-inner{max-width:1160px;margin:0 auto}
.crumb{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;margin-bottom:9px;flex-wrap:wrap}
.crumb b{color:var(--fg-2);font-weight:500}
.page-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.page-h h1{font-size:22px;letter-spacing:-.3px}
.page-h .en{color:var(--faint);font-size:12.5px;font-weight:500;font-family:var(--mono)}
.page-path{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-bottom:18px}
.page-path .pill-path{background:var(--surface-3);border:1px solid var(--border);padding:1px 7px;border-radius:5px}

.spec{display:flex;gap:12px;background:var(--pri-weak);border:1px solid color-mix(in srgb,var(--pri) 25%,transparent);border-radius:var(--radius);padding:13px 15px;margin-bottom:20px}
.spec .tag{flex:none;align-self:flex-start;font-size:10.5px;font-weight:700;letter-spacing:.05em;background:var(--pri);color:var(--pri-fg);padding:3px 8px;border-radius:5px;margin-top:1px}
.spec .body{min-width:0}
.spec .body p{margin:0 0 6px;color:var(--pri-weak-fg);font-size:13px;font-weight:500}
.spec ul{margin:0;padding-left:17px;color:var(--fg-2);font-size:12.5px}
.spec ul li{margin:2px 0}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:18px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px;border-bottom:1px solid var(--border)}
.card-h h3{font-size:14px;display:flex;align-items:center;gap:8px}
.card-h h3 .dot{width:7px;height:7px;border-radius:2px;background:var(--pri)}
.card-b{padding:16px}
.card-b.flush{padding:0}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.toolbar .sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;height:33px;padding:0 13px;border-radius:7px;border:1px solid var(--border-strong);background:var(--surface);color:var(--fg-2);font-size:12.5px;font-weight:500}
.btn:hover{border-color:var(--pri);color:var(--pri)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-fg)}
.btn.pri:hover{background:var(--pri-d);border-color:var(--pri-d);color:var(--pri-fg)}
.btn.ghost{background:var(--surface-2)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
.btn.danger:hover{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.sm{height:27px;padding:0 9px;font-size:11.5px}

.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:13px;margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.02em}
.inp{height:32px;min-width:120px;border:1px solid var(--border-strong);background:var(--surface);color:var(--fg);border-radius:6px;padding:0 9px;font-size:12.5px;font-family:inherit}
.inp.wide{min-width:220px}
.inp[disabled]{color:var(--faint)}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:6px;overflow:hidden;flex-wrap:wrap}
.seg button{height:32px;padding:0 11px;border:0;background:var(--surface);color:var(--fg-2);font-size:12px;border-left:1px solid var(--border)}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--pri);color:var(--pri-fg)}

table{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl-wrap{overflow-x:auto}
thead th{background:var(--surface-2);text-align:left;padding:10px 12px;color:var(--fg-2);font-weight:700;font-size:11.5px;white-space:nowrap;border-bottom:1px solid var(--border);border-top:1px solid var(--border)}
tbody td{padding:10px 12px;border-bottom:1px solid var(--border);color:var(--fg-2);vertical-align:middle;white-space:nowrap}
table.dt tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
td.num,th.num{text-align:center;color:var(--muted)}
.thumb{width:34px;height:34px;border-radius:6px;background:var(--surface-3);border:1px solid var(--border);display:grid;place-items:center;color:var(--faint);font-size:9px}
.lnk{color:var(--pri);font-weight:500}
.sub{color:var(--muted);font-size:11px}
.row-act{display:flex;gap:5px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)}.p-warn{background:var(--warn-bg);color:var(--warn)}
.p-danger{background:var(--danger-bg);color:var(--danger)}.p-info{background:var(--info-bg);color:var(--info)}.p-muted{background:var(--surface-3);color:var(--muted)}
.dotp{width:6px;height:6px;border-radius:50%;background:currentColor}
.pager{display:flex;justify-content:center;gap:4px;padding:14px}
.pager button{min-width:30px;height:30px;border:1px solid var(--border);background:var(--surface);color:var(--fg-2);border-radius:6px;font-size:12px}
.pager button.on{background:var(--pri);color:var(--pri-fg);border-color:var(--pri)}

.form-tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.form-tbl th{width:170px;text-align:left;vertical-align:top;padding:12px 14px;background:var(--surface-2);color:var(--fg-2);font-weight:700;font-size:12.5px;border-bottom:1px solid var(--border);border-right:1px solid var(--border)}
.form-tbl th .req{color:var(--danger);margin-left:3px}
.form-tbl td{padding:11px 14px;border-bottom:1px solid var(--border)}
.ta{width:100%;min-height:72px;border:1px solid var(--border-strong);background:var(--surface);color:var(--fg);border-radius:6px;padding:9px;font-size:12.5px;font-family:inherit;resize:vertical}
.hint{color:var(--muted);font-size:11px;margin-top:4px}
.toggle{display:inline-flex;align-items:center;gap:7px;color:var(--fg-2);font-size:12px}
.switch{width:38px;height:21px;border-radius:999px;background:var(--border-strong);position:relative;flex:none;cursor:pointer;border:0}
.switch.on{background:var(--pri)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#fff;transition:.15s}
.switch.on::after{left:19px}
.radios{display:flex;gap:16px;flex-wrap:wrap;color:var(--fg-2);font-size:12.5px}
.radios label{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.dotradio{width:14px;height:14px;border-radius:50%;border:2px solid var(--border-strong)}
.dotradio.on{border-color:var(--pri);box-shadow:inset 0 0 0 3px var(--pri)}
.form-foot{display:flex;justify-content:center;gap:9px;padding:18px;border-top:1px solid var(--border);background:var(--surface-2)}

.grid{display:grid;gap:16px}
.stat-row{grid-template-columns:repeat(4,1fr)}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:15px 16px}
.stat .k{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;font-weight:500}
.stat .k .ic{width:15px;height:15px;color:var(--pri)}
.stat .v{font-size:25px;font-weight:900;margin-top:7px;letter-spacing:-.5px}
.stat .d{font-size:11.5px;margin-top:3px;color:var(--muted)}
.stat .d b.up{color:var(--ok)} .stat .d b.dn{color:var(--danger)}
.two-col{grid-template-columns:1fr 1fr}
.notice-strip{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:11px 14px;margin-bottom:16px;font-size:12.5px;color:var(--fg-2)}
.notice-strip .tagn{background:var(--brand);color:#fff;font-weight:700;font-size:10.5px;padding:3px 8px;border-radius:5px;flex:none}
.chart-wrap{padding:6px 4px 0}
.chart-cap{text-align:center;font-size:13px;font-weight:700;margin-bottom:6px;color:var(--fg-2)}
.legend{display:flex;justify-content:center;gap:16px;margin-top:8px;font-size:11.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.sample-note{font-size:11px;color:var(--faint);margin-top:2px}
.sample-badge{font-size:10px;color:var(--faint);border:1px dashed var(--border-strong);padding:1px 6px;border-radius:5px}

.ov-hero{background:linear-gradient(120deg,#20334d,#2f6a93);color:#fff;border-radius:14px;padding:26px 24px;margin-bottom:20px}
.ov-hero h1{font-size:25px;letter-spacing:-.5px}
.ov-hero p{margin:9px 0 0;color:#d2dcec;font-size:13.5px;max-width:60ch}
.ov-hero .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.ov-hero .chip{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:5px 12px;font-size:12px}
.ov-hero .chip b{color:#ffd9a6}
.ov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-bottom:20px}
.ov-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:15px 16px}
.ov-card h4{display:flex;align-items:center;gap:9px;font-size:13.5px;margin-bottom:9px}
.ov-card h4 .ico{color:var(--pri)}
.ov-card .cnt{margin-left:auto;font-size:11px;color:var(--muted);font-weight:500}
.ov-card ul{margin:0;padding:0;list-style:none}
.ov-card li{padding:4px 0;font-size:12.5px;border-top:1px dashed var(--border)}
.ov-card li:first-child{border-top:0}
.ov-card li button{background:0;border:0;padding:0;color:var(--fg-2);font-size:12.5px;text-align:left;width:100%;cursor:pointer}
.ov-card li button:hover{color:var(--pri)}
.ov-card li .sl{color:var(--faint);font-family:var(--mono);font-size:10.5px;float:right}
.legend-box{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.ext-card{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.ext-card .big{width:46px;height:46px;border-radius:12px;background:var(--pri-weak);color:var(--pri);display:grid;place-items:center;flex:none}

/* ---- toast ---- */
#toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;padding:0 12px}
.toast{background:#20262e;color:#fff;padding:10px 16px;border-radius:9px;font-size:12.5px;box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:1;transform:translateY(0);transition:.28s;max-width:90vw}
.toast.out{opacity:0;transform:translateY(8px)}
.toast b{color:#8fd0f0}

/* ---- modal ---- */
.ov-modal{position:fixed;inset:0;z-index:70;background:rgba(15,25,40,.5);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.modal-box{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:100%;max-width:560px;animation:pop .18s ease}
@keyframes pop{from{opacity:0;transform:translateY(-8px) scale(.99)}to{opacity:1;transform:none}}
.modal-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 18px;border-bottom:1px solid var(--border)}
.modal-h h3{font-size:15px}
.modal-h .x{background:0;border:0;color:var(--muted);font-size:20px;line-height:1;padding:2px 6px;border-radius:6px}
.modal-h .x:hover{background:var(--surface-3);color:var(--fg)}
.modal-b{padding:4px 0;max-height:62vh;overflow-y:auto}
.modal-b .form-tbl th{width:150px}
.modal-msg{padding:20px 18px;font-size:13.5px;color:var(--fg-2)}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--border);background:var(--surface-2);border-radius:0 0 12px 12px}

@media (max-width:1100px){.stat-row{grid-template-columns:repeat(2,1fr)}}
@media (max-width:960px){
  .hamb{display:block}
  .sidebar{position:fixed;top:56px;bottom:0;left:0;z-index:50;transform:translateX(-100%);transition:transform .22s;padding-left:env(safe-area-inset-left,0px)}
  .sidebar.open{transform:none}
  .scrim.show{display:block;position:fixed;inset:56px 0 0;background:rgba(5,10,20,.5);z-index:45}
  .two-col{grid-template-columns:1fr}
}

/* ============ sample cell generator ============ */
const NAMES=['최병국','김서연','박준호','이하늘','정민재','쿡이에요','테스트'];
const IDS=['bkchoi','seoyeon','jun_ho','skylee','mjjung','cook77','guest'];
const PRODS=['알리오 X 01','완전좋아 가구','[친환경쌀] 천년미소 20kg','14k 골드 꼬임이어링','Silver 925 은반지','테스트 상품'];
const DATES=['2026-08-12','2026-07-30','2026-07-18','2026-06-24','2026-05-10'];
const ORD_ST=[['결제완료','p-ok'],['배송준비','p-warn'],['상품발송','p-info'],['상품수령','p-muted'],['구매완료','p-ok'],['주문취소요청','p-danger'],['주문취소완료','p-muted']];
function won(n){return '<span class="tnum">'+n.toLocaleString()+'</span> 원';}
function pill(t,c){return '<span class="pill '+c+'"><span class="dotp"></span>'+t+'</span>';}
function cellFor(label,i){
 const L=label,has=s=>L.indexOf(s)>-1;
 if(has('이미지'))return '<div class="thumb">IMG</div>';
 if(has('주문번호'))return '<span class="lnk mono">2026'+(8120-i).toString().padStart(4,'0')+'001</span>';
 if(has('상품코드'))return '<span class="mono">G'+(10427-i).toString().padStart(5,'0')+'</span>';
 if(L==='번호'||L==='순위')return '<span class="tnum">'+i+'</span>';
 if(has('고유번호'))return '<span class="mono tnum">'+(4+i)+'</span>';
 if(has('우편번호'))return '<span class="mono tnum">6'+(3100+i*7)+'</span>';
 if(has('일시')||has('일자')||L==='가입일'||L==='등록일'||L==='변동일'||L==='생성일'||L==='탈퇴일'||has('방문일'))return '<span class="tnum sub">'+DATES[i%DATES.length]+'</span>';
 if(has('노출기간'))return '<span class="tnum sub">2026-08-01 ~ 2026-08-31</span>';
 if(L.indexOf('금액')>-1||L.indexOf('가격')>-1||has('단가')||has('옵션가')||has('적립금')||has('잔고')||has('배송비')||has('변동액'))return won([40500,63000,48000,31185,5000][i%5]);
 if(has('수량'))return '<span class="tnum">'+(1+(i%3))+'</span>';
 if(has('재고'))return '<span class="tnum">'+([128,42,7,0,310][i%5])+'</span>';
 if(has('조회'))return '<span class="tnum sub">'+(412-i*37)+'</span>';
 if(L==='주문상태'){const s=ORD_ST[i%ORD_ST.length];return pill(s[0],s[1]);}
 if(L==='결제수단')return '<span class="sub">무통장입금</span>';
 if(has('만족도'))return '<span style="color:var(--warn)">'+'★'.repeat(5-(i%2))+'<span style="color:var(--border-strong)">'+'★'.repeat(i%2)+'</span></span>';
 if(has('답변여부'))return i%2? pill('답변완료','p-ok'):pill('미답변','p-danger');
 if(L==='사용여부'||L==='기본'||has('노출여부')||has('표시여부'))return i%3===2? pill('미사용','p-muted'):pill('사용','p-ok');
 if(L==='Best 상품')return i%2?pill('Best','p-info'):'<span class="sub">-</span>';
 if(L==='New 상품')return i%2===0?pill('New','p-ok'):'<span class="sub">-</span>';
 if(has('수신동의'))return '<span class="sub">SMS '+(i%2?'Y':'N')+' / 메일 '+(i%2?'N':'Y')+'</span>';
 if(has('IP'))return '<span class="mono tnum">211.'+(36+i)+'.'+(120-i*3)+'.'+(5+i)+'</span>';
 if(has('유형')&&L.indexOf('문의')<0)return ['구매적립','사용','관리자지급','구매적립','사용차감'][i%5];
 if(has('문의유형'))return ['배송문의','상품문의','교환/반품','재입고','기타'][i%5];
 if(has('유입경로')||has('유입'))return ['naver.com','google.com','직접입력','instagram.com','daum.net'][i%5];
 if(has('키워드'))return '<span class="sub">tagoplus '+['쌀','가구','은반지','이어링','선물'][i%5]+'</span>';
 if(has('브라우저'))return ['Chrome','Safari','Edge','Samsung','Firefox'][i%5];
 if(has('운영체제')||has('OS'))return ['Windows','Android','iOS','macOS','Android'][i%5];
 if(has('아이디')||L==='관리자 ID')return '<span class="mono">'+IDS[i%IDS.length]+'</span>';
 if(has('그룹명'))return i===1?'최고관리자':'상품관리자';
 if(L==='성명'||L==='주문자'||L==='받는이'||L==='작성자'||has('예금주')||has('관리자명'))return NAMES[i%NAMES.length];
 if(has('연락처')||has('휴대폰')||has('전화'))return '<span class="mono tnum">010-'+(1234+i)+'-'+(5600+i*3)+'</span>';
 if(has('주소'))return '<span class="sub">서울 강남구 테헤란로 123</span>';
 if(has('은행'))return ['국민','신한','우리'][i%3]+'은행';
 if(has('계좌번호'))return '<span class="mono tnum">123-45-'+(678900+i)+'</span>';
 if(has('택배사'))return ['CJ대한통운','롯데택배','한진택배'][i%3];
 if(has('추적URL')||has('URL'))return '<span class="mono sub">https://tracker…</span>';
 if(has('시도'))return ['제주특별자치도','인천광역시','경상북도'][i%3];
 if(has('지역 주소'))return '<span class="sub">제주시 일원(도서)</span>';
 if(has('상품분류/상품정보')||has('상품정보')||has('상품분류/정보'))return '<div><div>'+PRODS[i%PRODS.length]+'</div><div class="sub">주얼리 › 반지</div></div>';
 if(has('주문상품'))return '<div>'+PRODS[i%PRODS.length]+'<div class="sub">옵션: 기본 / 1개</div></div>';
 if(has('제목')||has('내용')||has('정보'))return '<span>'+['9월 업무시간 안내','배송 지연 안내','적립금 사용 방법','가을맞이 기획전'][i%4]+'</span>';
 if(has('팝업제목'))return '회원가입 이벤트';
 if(has('위치구분'))return ['메인 중앙','좌측 상단','전체'][i%3];
 if(has('팝업타입'))return i%2?'레이어':'윈도우';
 if(has('분류명'))return ['주얼리','생활/가구','식품','의류'][i%4];
 if(has('진열여부'))return i%3===2?pill('미진열','p-muted'):pill('진열','p-ok');
 if(has('진열순위'))return '<span class="tnum">'+i+'</span>';
 if(has('탈퇴사유'))return ['서비스 불만','단순 변심','재가입 예정'][i%3];
 if(has('지급/차감')||has('내역'))return '<span class="sub">구매확정 적립 (주문 2026…)</span>';
 if(L==='설정'||L==='관리')return '<div class="row-act"><button class="btn sm" data-act="edit">수정</button><button class="btn sm danger" data-act="del">삭제</button></div>';
 return '<span class="sub">—</span>';
}

/* ============ renderers ============ */
function el(h){const d=document.createElement('div');d.innerHTML=h;return d.firstElementChild;}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function specBox(n){ if(!n)return ''; return `<div class="spec"><span class="tag">기획</span><div class="body"><p>${n.p}</p>${n.li?'<ul>'+n.li.map(x=>'<li>'+x+'</li>').join('')+'</ul>':''}</div></div>`;}
function iconFor(menu){const m={'주문배송':'order','상품관리':'goods','고객 및 문의관리':'member','프로모션':'promo','팝업 및 디자인관리':'design','게시판':'board','매출분석':'sales','접속통계':'counter','환경설정':'settings','HOME':'home'};return m[menu]||'settings';}
function pageHead(s){return `<div class="crumb">${svg(iconFor(s.menu),'ico')}<b>${s.menu}</b> › <b>${s.title}</b></div><div class="page-h"><h1>${s.title}</h1><span class="en">${s.en||''}</span></div><div class="page-path"><span class="pill-path">${s.path}</span></div>`;}
function toolKind(label){if(/엑셀/.test(label))return 'excel';if(/추가|등록|글쓰기/.test(label))return 'create';if(/삭제/.test(label))return 'bulkdel';if(/일괄수정|일괄설정/.test(label))return 'bulkedit';if(/초기화/.test(label))return 'reset';return 'generic';}
function renderFilters(filters){
 if(!filters||!filters.length)return '';
 let h='<div class="filters">';
 filters.forEach(f=>{
   if(f.type==='period')h+=`<div class="field"><label>${f.label}</label><div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><input class="inp" disabled placeholder="시작일"><span class="sub">~</span><input class="inp" disabled placeholder="종료일"><div class="seg"><button>오늘</button><button>일주일</button><button class="on">한달</button><button>전체</button></div></div></div>`;
   else if(f.type==='sel')h+=`<div class="field"><label>${f.label}</label><select class="inp">${(f.opt||['전체']).map(o=>'<option>'+o+'</option>').join('')}</select></div>`;
   else h+=`<div class="field"><label>${f.label}</label><input class="inp wide" placeholder="검색어 입력"></div>`;
 });
 h+=`<div class="field"><label>&nbsp;</label><button class="btn pri" data-act="search">🔍 Search</button></div></div>`;
 return h;
}
function toolbar(actions,total){
 let h='<div class="toolbar">';
 if(total!=null)h+=`<div style="font-size:12.5px;color:var(--muted)">총 <b style="color:var(--fg)">${total.toLocaleString()}</b> 건</div>`;
 h+='<div class="sp"></div>';
 (actions||[]).forEach(a=>h+=`<button class="btn ${a[1]||'pri'}" data-act="tool" data-kind="${toolKind(a[0])}">${a[0]}</button>`);
 h+='</div>';return h;
}
function listTable(s,extraClass){
 let rows='';for(let i=1;i<=6;i++){rows+='<tr><td style="text-align:center"><input type="checkbox"></td>'+s.cols.map(c=>{const cl=(c==='번호'||c==='순위')?' class="num"':'';return `<td${cl}>${cellFor(c,i)}</td>`;}).join('')+'</tr>';}
 return `<div class="card"><div class="tbl-wrap"><table class="dt ${extraClass||''}"><thead><tr><th style="width:36px;text-align:center"><input type="checkbox"></th>${s.cols.map(c=>'<th'+((c==='번호'||c==='순위')?' class="num"':'')+'>'+c+'</th>').join('')}</tr></thead><tbody>${rows}</tbody></table></div><div class="pager"><button>‹</button><button class="on">1</button><button>2</button><button>3</button><button>›</button></div></div>`;
}
function renderList(s){
 return pageHead(s)+specBox(s.note)+renderFilters(s.filters)+(s.treeHint?'<div class="notice-strip"><span class="tagn">TREE</span>1차 › 2차 › 3차 다단계 카테고리. 각 행에서 하위 분류 추가·순서 변경.</div>':'')+toolbar(s.actions,s.total)+listTable(s,'editable')+`<p class="sample-note">※ 행을 클릭하면 상세보기, <b>수정/삭제·추가</b> 버튼으로 편집할 수 있습니다. 데이터는 레이아웃 확인용 샘플입니다.</p>`;
}
function fieldInput(type,ph,val){
 const v=val?esc(val):'';
 switch(type){
  case 'toggle':return '<button class="switch on" data-act="switch"></button> <span class="sub" style="vertical-align:4px">사용</span>';
  case 'radio':return '<span class="radios">'+(ph||'옵션1·옵션2').split('·').map((o,i)=>`<label data-act="radio"><span class="dotradio${i===0?' on':''}"></span>${o}</label>`).join('')+'</span>';
  case 'sel':return `<select class="inp wide"><option>${(ph||'선택').split('/')[0]}</option></select>`+(ph?`<div class="hint">${ph}</div>`:'');
  case 'num':return '<input class="inp" placeholder="0"><span class="sub"> 개</span>';
  case 'price':return '<input class="inp" value="'+v+'" placeholder="0"><span class="sub"> 원</span>'+(ph?`<div class="hint">${ph}</div>`:'');
  case 'range':return '<input class="inp" style="min-width:70px" placeholder="최소"> ~ <input class="inp" style="min-width:70px" placeholder="최대"><div class="hint">'+(ph||'')+'</div>';
  case 'ta':return '<textarea class="ta" placeholder="'+(ph||'내용 입력')+'"></textarea>';
  case 'editor':return '<div class="ta" style="min-height:120px;color:var(--faint)">⌨ 에디터(위지윅) 영역 — 이미지·서식 지원</div>';
  case 'file':return '<span class="btn sm ghost">파일 선택</span> <span class="sub">'+(ph||'권장 사이즈 안내')+'</span>';
  case 'tags':return '<span style="display:flex;gap:6px;flex-wrap:wrap">'+(ph||'태그1·태그2').split('·').map(t=>'<span class="pill p-muted">'+t+'</span>').join('')+'</span>';
  case 'chips':return '<span style="display:flex;gap:6px;flex-wrap:wrap">'+(ph||'A·B·C').split('·').map((t,i)=>'<span class="pill '+(i%2?'p-info':'p-ok')+'">'+t+'</span>').join('')+'</span>';
  case 'table':return '<div class="ta" style="min-height:58px;color:var(--faint)">옵션값 입력 → 조합 자동 생성 · 조합별 추가금액/재고</div>';
  case 'iplist':return '<div style="display:flex;gap:6px"><input class="inp wide" placeholder="예) 211.36.120.5"> <button class="btn sm" data-act="save">추가</button></div><div class="hint">등록된 IP 목록이 아래 표로 표시됩니다.</div>';
  default:return '<input class="inp wide" value="'+v+'" placeholder="'+(ph||'입력')+'">';
 }
}
function renderForm(s){
 let secs=s.sections.map(sec=>`<div class="card"><div class="card-h"><h3><span class="dot"></span>${sec.t}</h3></div><div class="card-b flush"><table class="form-tbl"><tbody>${sec.f.map(f=>`<tr><th>${f[0]}${f[3]?'<span class="req">*</span>':''}</th><td>${fieldInput(f[1],f[2],f[4])}</td></tr>`).join('')}</tbody></table></div></div>`).join('');
 let bal=s.smsBalance?`<div class="grid stat-row" style="margin-bottom:18px"><div class="stat"><div class="k">SMS(단문)</div><div class="v tnum">0 <span style="font-size:14px;color:var(--muted)">건</span></div></div><div class="stat"><div class="k">LMS(장문)</div><div class="v tnum">0 <span style="font-size:14px;color:var(--muted)">건</span></div></div><div class="stat"><div class="k">알림톡</div><div class="v tnum">0 <span style="font-size:14px;color:var(--muted)">건</span></div></div><div class="stat"><div class="k">문자 충전</div><div class="v" style="font-size:16px;margin-top:11px"><button class="btn sm pri" data-act="save">충전하기</button></div></div></div>`:'';

function barChart(data,labels,accent){
 const W=640,H=220,pad=34,bw=(W-pad*2)/data.length,max=Math.max(...data)*1.15;
 let bars='',lbls='',grid='';
 for(let g=0;g<=4;g++){const y=H-pad-(H-pad*2)*g/4;grid+=`<line x1="${pad}" y1="${y}" x2="${W-pad}" y2="${y}" stroke="var(--border)" stroke-width="1"/><text x="${pad-6}" y="${y+3}" text-anchor="end" font-size="9" fill="var(--muted)">${Math.round(max*g/4).toLocaleString()}</text>`;}
 data.forEach((v,i)=>{const h=(H-pad*2)*v/max,x=pad+bw*i+bw*0.22,y=H-pad-h;bars+=`<rect x="${x}" y="${y}" width="${bw*0.56}" height="${h}" rx="3" fill="${accent||'var(--pri)'}"/><text x="${x+bw*0.28}" y="${y-5}" text-anchor="middle" font-size="9" fill="var(--fg-2)" font-weight="600">${v.toLocaleString()}</text>`;lbls+=`<text x="${x+bw*0.28}" y="${H-pad+14}" text-anchor="middle" font-size="9.5" fill="var(--muted)">${labels[i]}</text>`;});
 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${grid}${bars}${lbls}</svg>`;
}

/* ============ toast & modal ============ */
function toast(msg){const t=el(`<div class="toast">${msg}</div>`);document.getElementById('toasts').appendChild(t);setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),320);},2200);}
let modalEl=null;
function closeModal(){if(modalEl){modalEl.remove();modalEl=null;}}
function openModal(title,bodyHTML,footBtns){
 closeModal();
 const foot=footBtns.map((b,i)=>`<button class="btn ${b.cls||''}" data-mi="${i}">${b.label}</button>`).join('');
 modalEl=el(`<div class="ov-modal"><div class="modal-box"><div class="modal-h"><h3>${title}</h3><button class="x" data-close>×</button></div><div class="modal-b">${bodyHTML}</div><div class="modal-f">${foot}</div></div></div>`);
 document.body.appendChild(modalEl);
 modalEl.addEventListener('click',e=>{if(e.target===modalEl||e.target.hasAttribute('data-close'))closeModal();const mi=e.target.closest('[data-mi]');if(mi){const b=footBtns[+mi.dataset.mi];if(b.on){if(b.on(modalEl)===false)return;}closeModal();}});
}
function confirmModal(msg,onYes){openModal('확인',`<div class="modal-msg">${msg}</div>`,[{label:'취소'},{label:'확인',cls:'danger',on:onYes}]);}

/* record detail / edit / create */
const SKIP=['설정','관리','도움말'];
function pickTitle(cells,fallback){for(const k of ['제목','상품명','주문번호','아이디','성명','팝업제목','분류명','택배사명','은행명','상품정보']){const c=cells.find(x=>x.L.indexOf(k)>-1);if(c&&c.text)return c.text;}return fallback;}
function collect(tr){
 const table=tr.closest('table'),ths=[...table.tHead.rows[0].cells];
 return ths.map((th,idx)=>({L:th.textContent.trim(),idx,cell:tr.cells[idx],text:(tr.cells[idx]?tr.cells[idx].textContent.trim():'')})).filter(c=>c.L && !c.cell.querySelector('input[type=checkbox]'));
}
function recordBody(items,editable){
 return `<table class="form-tbl"><tbody>${items.filter(c=>!SKIP.includes(c.L)).map(c=>{
   if(c.L.indexOf('이미지')>-1)return `<tr><th>${c.L}</th><td><div class="thumb">IMG</div></td></tr>`;
   const val=esc(c.text);
   return `<tr><th>${c.L}</th><td><input class="inp wide" data-idx="${c.idx}" value="${val}" ${editable?'':'disabled'}></td></tr>`;
 }).join('')}</tbody></table>`;
}
function openRecordModal(tr,mode){
 const items=collect(tr),title=pickTitle(items,'상세 정보');
 const editable=mode==='edit';
 const body=recordBody(items,editable);
 const foot=editable?[{label:'취소'},{label:'저장',cls:'pri',on:m=>{m.querySelectorAll('input[data-idx]').forEach(inp=>{const td=tr.cells[+inp.dataset.idx];if(td&&!td.querySelector('.thumb'))td.textContent=inp.value;});toast('수정 내용을 저장했습니다 <b>(데모)</b>');}}]:[{label:'닫기'},{label:'수정',cls:'pri',on:()=>{setTimeout(()=>openRecordModal(tr,'edit'),0);}}];
 openModal(mode==='edit'?title+' · 수정':title,body,foot);
}
function openCreateModal(table,label){
 const ths=[...table.tHead.rows[0].cells];
 const cols=ths.map(th=>th.textContent.trim()).filter(L=>L && !['번호','순위','설정','관리','도움말','기본'].includes(L) && L.indexOf('이미지')<0);
 const body=`<table class="form-tbl"><tbody>${cols.map(L=>`<tr><th>${L}</th><td><input class="inp wide" data-col="${esc(L)}" placeholder="입력"></td></tr>`).join('')}</tbody></table>`;
 openModal((label||'새 항목')+' 등록',body,[{label:'취소'},{label:'저장',cls:'pri',on:m=>{
   const vals={};m.querySelectorAll('input[data-col]').forEach(inp=>vals[inp.dataset.col]=inp.value);
   const n=table.tBodies[0].rows.length+1;
   const tds=ths.map(th=>{const L=th.textContent.trim();
     if(th.querySelector('input[type=checkbox]')||L==='')return '<td style="text-align:center"><input type="checkbox"></td>';
     if(L==='번호'||L==='순위')return '<td class="num"><span class="tnum">'+n+'</span></td>';
     if(L.indexOf('이미지')>-1)return '<td><div class="thumb">IMG</div></td>';
     if(L==='설정'||L==='관리')return '<td><div class="row-act"><button class="btn sm" data-act="edit">수정</button><button class="btn sm danger" data-act="del">삭제</button></div></td>';
     if(L==='도움말')return '<td><button class="btn sm" data-act="ruleedit">편집</button></td>';
     return '<td>'+(vals[L]?esc(vals[L]):'<span class="sub">-</span>')+'</td>';});
   table.tBodies[0].insertAdjacentHTML('afterbegin','<tr>'+tds.join('')+'</tr>');
   toast('새 항목을 등록했습니다 <b>(데모)</b>');
 }}]);
}

/* ============ delegated interactions ============ */
const view=document.getElementById('view');
view.addEventListener('click',function(e){
 if(e.target.matches('thead input[type=checkbox]')){const tb=e.target.closest('table').tBodies[0];tb.querySelectorAll('input[type=checkbox]').forEach(x=>x.checked=e.target.checked);return;}
 if(e.target.closest('.switch[data-act="switch"]')){e.target.closest('.switch').classList.toggle('on');return;}
 const radio=e.target.closest('[data-act="radio"]');
 if(radio){radio.parentElement.querySelectorAll('.dotradio').forEach(d=>d.classList.remove('on'));radio.querySelector('.dotradio').classList.add('on');return;}
 const b=e.target.closest('button,a,[data-go]');
 if(b){
   if(b.tagName==='A')return;
   if(b.dataset.go){go(b.dataset.go);return;}
   const seg=b.closest('.seg');
   if(seg&&b.tagName==='BUTTON'){[...seg.children].forEach(x=>x.classList.remove('on'));b.classList.add('on');toast(b.textContent.trim()+' 기준으로 전환 <b>(데모)</b>');return;}
   const pg=b.closest('.pager');
   if(pg){[...pg.querySelectorAll('button')].forEach(x=>x.classList.remove('on'));if(/^\d+$/.test(b.textContent.trim()))b.classList.add('on');return;}
   const act=b.dataset.act;
   if(act==='search'){toast('검색 조건으로 조회했습니다 <b>(데모)</b>');return;}
   if(act==='edit'){openRecordModal(b.closest('tr'),'edit');return;}
   if(act==='del'){const tr=b.closest('tr');confirmModal('이 항목을 삭제하시겠습니까?',()=>{tr.remove();toast('삭제되었습니다 <b>(데모)</b>');});return;}
   if(act==='ruleedit'){openModal((b.dataset.cond||'문구')+' 문자 편집',`<div style="padding:14px 16px"><textarea class="ta" style="min-height:120px">[고객명]님, 주문이 정상 처리되었습니다. 감사합니다.</textarea><div class="hint">[고객명] [주문번호] [상품명] [금액] 등 치환변수 사용 가능</div></div>`,[{label:'취소'},{label:'저장',cls:'pri',on:()=>toast('문구를 저장했습니다 <b>(데모)</b>')}]);return;}
   if(act==='save'){toast((b.textContent.trim()||'저장')+' 완료 <b>(데모)</b>');return;}
   if(act==='tool'){handleTool(b);return;}
   return;
 }
 const tr=e.target.closest('tbody tr');
 if(tr&&tr.closest('table.dt')&&!e.target.closest('input,button,a')){openRecordModal(tr,'view');}
});
function nearestTable(b){const root=b.closest('.main-inner');return (root&&root.querySelector('table.editable'))||b.closest('.card')&&b.closest('.card').querySelector('table');}
function handleTool(b){
 const kind=b.dataset.kind,label=b.textContent.trim();
 if(kind==='create'){const t=nearestTable(b);if(t)openCreateModal(t,label);else toast(label+' <b>(데모)</b>');return;}
 if(kind==='excel'){toast('엑셀 파일을 내보냈습니다 <b>(데모)</b>');return;}
 if(kind==='bulkdel'){const t=nearestTable(b);const checked=t?[...t.tBodies[0].querySelectorAll('input[type=checkbox]:checked')]:[];if(!checked.length){toast('선택된 항목이 없습니다');return;}confirmModal(`선택한 ${checked.length}건을 삭제하시겠습니까?`,()=>{checked.forEach(c=>c.closest('tr').remove());toast(checked.length+'건을 삭제했습니다 <b>(데모)</b>');});return;}
 if(kind==='bulkedit'){toast('선택 항목을 일괄 수정했습니다 <b>(데모)</b>');return;}
 if(kind==='reset'){confirmModal('통계를 초기화하시겠습니까?',()=>toast('초기화되었습니다 <b>(데모)</b>'));return;}
 toast(label+' <b>(데모)</b>');
}

/* ============ sidebar / routing ============ */
function buildSidebar(){
 const sb=document.getElementById('sidebar');let h='';
 NAV.forEach((n,gi)=>{
   if(n.single){h+=`<button class="nav-single" data-go="${n.id}">${svg(n.icon)}<span>${n.label}</span></button>`;}
   else{h+=`<div class="nav-group" data-gi="${gi}"><button class="nav-head"><span class="hl">${svg(n.icon)}<span>${n.group}</span></span><svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></button><div class="submenu">`;
     n.items.forEach(it=>{if(it[0].startsWith('sub:'))h+=`<div class="sub-label">${it[0].slice(4)}</div>`;else h+=`<button class="sub-item" data-go="${it[0]}">${it[1]}</button>`;});
     h+='</div></div>';}
 });
 sb.innerHTML=h;
 sb.querySelectorAll('.nav-head').forEach(bt=>bt.addEventListener('click',()=>bt.parentElement.classList.toggle('open')));
 sb.querySelectorAll('[data-go]').forEach(bt=>bt.addEventListener('click',()=>go(bt.dataset.go)));
}
function buildQuick(){
 const q=document.getElementById('qicks');
 q.innerHTML=QUICK.map(x=>`<button class="qick" data-go="${x[0]}" style="background:${x[2]}" title="${LABEL[x[0]]||''}">${svg(x[1])}</button>`).join('');
 q.querySelectorAll('[data-go]').forEach(bt=>bt.addEventListener('click',()=>go(bt.dataset.go)));
}
const LABEL={};NAV.forEach(n=>{if(n.single)LABEL[n.id]=n.label;else if(n.items)n.items.forEach(it=>{if(!it[0].startsWith('sub:'))LABEL[it[0]]=it[1];});});
function setActive(id){
 document.querySelectorAll('.sidebar [data-go]').forEach(b=>b.classList.toggle('active',b.dataset.go===id));
 NAV.forEach((n,gi)=>{if(n.items&&n.items.some(it=>it[0]===id)){const g=document.querySelector(`.nav-group[data-gi="${gi}"]`);if(g)g.classList.add('open');}});
}
function go(id){
 closeModal();
 if(id==='overview')view.innerHTML=renderOverview();
 else{const s=S[id];if(!s)return;view.innerHTML=(RENDER[s.kind]||renderList)(s);}
 setActive(id);try{location.hash=id;}catch(e){}
 window.scrollTo(0,0);closeDrawer();
}

/* drawer */
function openDrawer(){document.getElementById('sidebar').classList.add('open');document.getElementById('scrim').classList.add('show');}
function closeDrawer(){document.getElementById('sidebar').classList.remove('open');document.getElementById('scrim').classList.remove('show');}
document.getElementById('hamb').addEventListener('click',openDrawer);
document.getElementById('scrim').addEventListener('click',closeDrawer);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

/* theme */
function applyTheme(t){const r=document.documentElement;if(t)r.setAttribute('data-theme',t);document.getElementById('theme-tx').textContent=(t==='dark')?'라이트':'다크';try{localStorage.setItem('sw-theme',t);}catch(e){}}
document.getElementById('theme').addEventListener('click',()=>{const cur=document.documentElement.getAttribute('data-theme');let next;if(cur==='dark')next='light';else if(cur==='light')next='dark';else next=matchMedia('(prefers-color-scheme:dark)').matches?'light':'dark';applyTheme(next);});
(function(){let t=null;try{t=localStorage.getItem('sw-theme');}catch(e){}if(t)applyTheme(t);else document.getElementById('theme-tx').textContent='다크';})();

/* boot */
buildSidebar();buildQuick();
const start=(location.hash||'').replace('#','');
go((S[start]||start==='overview')?start:'overview');
</script>
