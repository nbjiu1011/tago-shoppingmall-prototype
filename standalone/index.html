<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>tagoplus 관리자</title>
<meta name="description" content="tagoplus 독립몰(자사몰) 관리자 프로토타입">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* tagoplus 관리자 UI 시안 기준: 네이비 사이드바 + 인디고 포인트 + 흰 카드 */
:root{
  --nav:#101b4d; --nav-2:#1a2760; --nav-fg:#d7dcf0; --nav-mute:#8f99c4;
  --pri:#5b5cf0; --pri-2:#6c6cf5; --pri-weak:#eeeefe; --blue:#3b82f6; --blue-weak:#dbeafe;
  --teal:#5cc6e0; --lilac:#a99cf5; --green:#16a34a; --green-2:#34c38f; --green-weak:#d9f7e8;
  --red:#e5484d; --red-weak:#fde8e8; --amber:#d97706; --amber-weak:#fef0d7;
  --bg:#f4f6fb; --card:#fff; --line:#e8ebf2; --line-2:#d9deea; --th:#f6f7fb;
  --ink:#161b33; --ink-2:#3d4460; --mute:#6f7690; --faint:#a3a9bd;
  --r:12px; --r-s:8px; --shadow:0 1px 3px rgba(22,27,51,.05),0 4px 14px rgba(22,27,51,.04);
  --side:232px; --rail:64px;
  --sans:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.tnum{font-variant-numeric:tabular-nums}
.ico{width:20px;height:20px;flex:none}
.ico.s{width:16px;height:16px}
[hidden]{display:none!important}

/* ---- shell ---- */
.app{display:flex;min-height:100vh}
.side{width:var(--side);flex:none;background:var(--nav);color:var(--nav-fg);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;z-index:50;transition:width .16s}
.brand{height:68px;display:flex;align-items:center;gap:9px;padding:0 20px;flex:none;color:#fff}
.brand b{font-size:20px;font-weight:700;letter-spacing:-.4px}
.brand span{font-size:14px;font-weight:600;margin-top:2px}
.rail-h{display:none;height:60px;align-items:center;justify-content:center;flex:none}
.rail-h button{background:0;border:0;color:#fff;padding:6px;display:grid}
.nav{flex:1;overflow-y:auto;padding:6px 12px 20px;scrollbar-width:thin;scrollbar-color:#2c3a7c transparent}
.nav-i{display:flex;align-items:center;gap:12px;width:100%;height:44px;padding:0 13px;margin-bottom:4px;background:0;border:0;border-radius:9px;color:var(--nav-fg);font-size:14.5px;font-weight:500;text-align:left;position:relative}
.nav-i:hover{background:var(--nav-2);color:#fff}
.nav-i.on{background:var(--pri-2);color:#fff;font-weight:600}
.nav-i .chev{margin-left:auto;width:15px;height:15px;transition:transform .15s;opacity:.8}
.nav-g.open>.nav-i .chev{transform:rotate(90deg)}
.nav-g.cur>.nav-i{color:#fff}
.subs{display:none;padding:2px 0 8px 32px}
.nav-g.open .subs{display:block}
.subs button{display:block;width:100%;background:0;border:0;text-align:left;color:var(--nav-mute);font-size:13px;padding:6px 10px;border-radius:7px}
.subs button:hover{color:#fff}
.subs button.on{color:#fff;font-weight:600;background:var(--nav-2)}
.subs .cap{font-size:11px;color:#6d78aa;padding:9px 10px 3px}
.fly-t{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:68px;display:flex;align-items:center;gap:12px;padding:0 24px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.hamb{background:0;border:0;padding:6px;display:grid;color:var(--ink)}
.crumb{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--ink-2);font-weight:500;min-width:0;white-space:nowrap}
.crumb b{color:var(--ink);font-weight:700;overflow:hidden;text-overflow:ellipsis}
.crumb .ico{width:14px;height:14px;color:var(--mute)}
.sp{flex:1}
.bell{position:relative;background:0;border:0;padding:6px;display:grid;color:var(--ink-2)}
.bell i{position:absolute;top:0;right:0;min-width:17px;height:17px;border-radius:99px;background:var(--red);color:#fff;font-size:10.5px;font-style:normal;font-weight:700;display:grid;place-items:center;border:2px solid #fff;box-sizing:content-box}
.top-btn{height:38px;display:inline-flex;align-items:center;gap:7px;padding:0 13px;background:#fff;border:1px solid var(--line-2);border-radius:var(--r-s);font-size:13.5px;font-weight:500;white-space:nowrap}
.top-btn:hover{background:var(--th)}
.av{width:28px;height:28px;border-radius:50%;background:#c9cfe4;display:grid;place-items:center;color:#fff;overflow:hidden;flex:none}
.pop{position:absolute;top:calc(100% + 8px);right:0;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:0 14px 40px rgba(16,27,77,.16);min-width:250px;padding:8px;z-index:60}
.pop .cap{font-size:11.5px;color:var(--mute);padding:8px 10px 4px;font-weight:600}
.pop button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:0;border:0;padding:8px 10px;border-radius:7px;font-size:13.5px}
.pop button:hover{background:var(--th)}
.pop button.on{color:var(--pri);font-weight:600;background:var(--pri-weak)}
.pop hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.rel{position:relative}
.view{padding:24px;flex:1;min-width:0}
.scrim{display:none}
.side-foot{flex:none;padding:10px 12px 14px;border-top:1px solid rgba(255,255,255,.08)}
.side-foot button{width:100%;height:40px;display:flex;align-items:center;gap:10px;padding:0 13px;border:0;border-radius:9px;background:0;color:var(--nav-mute);font-size:13.5px;font-weight:600}
.side-foot button:hover{background:var(--nav-2);color:#fff}
.rail-ic{display:grid;place-items:center;width:20px;height:20px;border-radius:6px;border:1px solid rgba(255,255,255,.18)}
.rail-ic .ico{width:14px;height:14px}
.rail-ic.flip{transform:rotate(180deg)}
body.rail .side-foot{padding:10px}
body.rail .side-foot button{justify-content:center;padding:0}
@media (min-width:901px){.top .hamb{display:none!important}}

/* rail: 시안 우측 패널의 아이콘 레일 */
body.rail .side{width:var(--rail)}
body.rail .brand b,body.rail .brand span,body.rail .chev,body.rail .nav-i .lb,body.rail .side-foot .lb{display:none}
body.rail .brand{justify-content:center;padding:0}
body.rail .rail-h{display:flex}
body.rail .hamb{display:none}
body.rail .nav{overflow:visible;padding:4px 10px}
body.rail .nav-i{justify-content:center;padding:0;height:42px}
body.rail .subs{display:none!important;position:absolute;left:100%;top:0;margin-left:0;width:208px;background:var(--nav);padding:10px;border-radius:0 10px 10px 0;box-shadow:8px 8px 24px rgba(16,27,77,.25)}
body.rail .nav-g{position:relative}
body.rail .nav-g:hover .subs{display:block!important}
body.rail .fly-t{display:block;color:#fff;font-weight:700;font-size:13.5px;padding:4px 10px 8px}

/* ---- page parts ---- */
.hello{color:var(--ink-2);font-size:14.5px;margin-bottom:6px}
.dash-h{display:flex;align-items:flex-end;flex-wrap:wrap;gap:12px;margin-bottom:20px}
.dash-h h1{font-size:30px;font-weight:800;letter-spacing:-.8px;line-height:1.25}
.dash-h .meta{color:var(--mute);font-size:13px;padding-bottom:5px}
.dash-h .meta i{font-style:normal;color:var(--line-2);margin:0 8px}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line-2);border-radius:var(--r-s);overflow:hidden;flex:none}
.seg button{height:38px;min-width:50px;padding:0 14px;background:0;border:0;border-left:1px solid var(--line);font-size:13.5px;color:var(--ink-2)}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--pri-2);color:#fff;font-weight:600}
.seg.sm button{height:34px;min-width:40px;padding:0 10px;font-size:12.5px}
.seg.sm button.on{background:var(--pri-weak);color:var(--pri)}
.range{height:38px;display:inline-flex;align-items:center;gap:9px;padding:0 13px;background:#fff;border:1px solid var(--line-2);border-radius:var(--r-s);font-size:13.5px;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:18px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid #eef0f6}
.kpi{padding:18px 20px;display:flex;gap:14px;position:relative;min-height:124px;cursor:pointer;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid #eef0f6;text-align:left}
.kpi:hover{border-color:var(--line-2)}
.kpi .ic{width:44px;height:44px;border-radius:12px;background:var(--pri-weak);color:var(--pri);display:grid;place-items:center;flex:none}
.kpi .k{font-size:14px;font-weight:600;color:var(--ink-2)}
.kpi .v{font-size:24px;font-weight:700;letter-spacing:-.4px;margin-top:3px}
.kpi .d{color:var(--green);font-weight:600;font-size:14px;margin-top:6px;display:flex;align-items:center;gap:5px}
.kpi .d::before{content:'';border:6px solid transparent;border-bottom:9px solid var(--green);border-top:0}
.kpi .d.dn{color:var(--red)}.kpi .d.dn::before{border-bottom:0;border-top:9px solid var(--red)}
.kpi .spark{position:absolute;right:16px;bottom:18px;width:76px;height:34px}
.g2{display:grid;grid-template-columns:1.58fr 1fr;gap:16px;margin-bottom:18px}
.g3{display:grid;grid-template-columns:1fr 1.5fr;gap:16px}
.pad{padding:20px 22px}
.c-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.c-h h3{font-size:18px;font-weight:700;letter-spacing:-.3px}
.c-h .more{margin-left:auto;background:0;border:0;color:var(--mute);font-size:12.5px;display:flex;align-items:center;gap:3px}
.legend{margin-left:auto;display:flex;gap:16px;font-size:12.5px;color:var(--ink-2)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%;display:block}
.donut{display:flex;align-items:center;gap:22px;flex-wrap:wrap;justify-content:center;padding-top:14px}
.donut svg{width:168px;height:168px;flex:none}
.d-l{flex:1;min-width:190px;font-size:13.5px}
.d-l div{display:flex;align-items:center;gap:9px;padding:6.5px 0;cursor:pointer}
.d-l i{width:10px;height:10px;border-radius:3px;flex:none}
.d-l b{margin-left:auto;font-weight:700}
.d-l em{font-style:normal;color:var(--mute);font-size:12.5px;min-width:52px;text-align:right}
.q-i{display:flex;align-items:center;gap:13px;width:100%;background:0;border:0;border-bottom:1px solid var(--line);padding:11px 0;font-size:14px;font-weight:500;text-align:left}
.q-i:last-child{border-bottom:0}
.q-i:hover{color:var(--pri)}
.q-i .ico{color:var(--ink-2)}
.q-i b{margin-left:auto;font-size:15px;font-weight:700}
.q-i .chev{width:15px;height:15px;color:var(--ink-2)}

/* tables */
.tbl-wrap{overflow-x:auto}
table.dt{width:100%;border-collapse:collapse;font-size:13px}
.dt th{background:var(--th);color:var(--ink);font-weight:700;padding:11px 12px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--line);font-size:12.5px}
.dt td{padding:11px 12px;border-bottom:1px solid var(--line);color:var(--ink-2);text-align:center;vertical-align:middle;white-space:nowrap}
.dt td.l{text-align:left;white-space:normal;min-width:170px}
.dt td.r{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}
.dt tbody tr:hover td{background:#fafbfe}
.dt tbody tr[data-rid]{cursor:pointer}
.dt tbody tr:last-child td{border-bottom:0}
.dt th:first-child,.dt td:first-child{border-radius:0}
.dt input[type=checkbox],.ck{width:16px;height:16px;accent-color:var(--pri);margin:0;vertical-align:middle}
.lnk{color:var(--pri);font-weight:600}
.sub{color:var(--mute);font-size:12px}
.pill{display:inline-flex;align-items:center;justify-content:center;height:24px;padding:0 11px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.p-blue{background:var(--blue-weak);color:#2f6fe0}.p-green{background:var(--green-weak);color:#0f9f6e}.p-violet{background:var(--pri-weak);color:var(--pri)}
.p-amber{background:var(--amber-weak);color:var(--amber)}.p-red{background:var(--red-weak);color:var(--red)}.p-gray{background:#eef0f5;color:var(--mute)}
.thumb{width:42px;height:42px;border-radius:8px;display:inline-grid;place-items:center;color:#fff;background:linear-gradient(135deg,#a6c8b2,#6c9a84)}
.thumb .ico{width:20px;height:20px}
.pinfo{display:flex;flex-direction:column}
.star{color:#f5a524;letter-spacing:1px}.star i{color:var(--line-2);font-style:normal}

/* filters + toolbar */
.head2{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.head2 h1{font-size:22px;font-weight:800;letter-spacing:-.5px}
.ro{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:99px;background:var(--amber-weak);color:var(--amber);font-size:12px;font-weight:600}
.filters{padding:18px 20px;display:flex;flex-wrap:wrap;gap:12px 30px;align-items:center;margin-bottom:14px}
.f{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-width:0}
.f>label{font-weight:700;font-size:13.5px;white-space:nowrap;min-width:56px}
.inp{height:38px;padding:0 11px;border:1px solid var(--line-2);border-radius:var(--r-s);background:#fff;font-size:13.5px;min-width:0;max-width:100%}
.inp:focus,.ta:focus{outline:2px solid #c9caf9;border-color:var(--pri)}
select.inp{padding-right:8px;min-width:130px}
.inp.wide{width:100%}
.inp.d{width:136px}
.inp.q{width:250px}
.inp:disabled,select:disabled,textarea:disabled{background:var(--th);color:var(--mute)}
.btn{height:38px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-2);border-radius:var(--r-s);background:#fff;font-size:13px;font-weight:500;white-space:nowrap;color:var(--ink)}
.btn:hover{background:var(--th)}
.btn.pri{background:var(--pri-2);border-color:var(--pri-2);color:#fff;font-weight:600}
.btn.pri:hover{background:var(--pri)}
.btn.danger{color:var(--red);border-color:#f3c5c6}
.btn.danger:hover{background:var(--red-weak)}
.btn.sm{height:28px;padding:0 9px;font-size:12px;border-radius:6px}
.btn.sm.pri{font-weight:600}
.btn .xl{color:var(--green)}
.tool{display:flex;align-items:center;gap:8px;padding:14px 18px;flex-wrap:wrap}
.tool .cnt{font-size:13px;color:var(--ink-2)}
.tool .cnt b{font-weight:700}
.acts{display:flex;gap:5px;justify-content:center;flex-wrap:nowrap}
.pager{display:flex;justify-content:center;gap:5px;padding:16px;flex-wrap:wrap}
.pager button{min-width:32px;height:32px;padding:0 6px;border:1px solid var(--line);background:#fff;border-radius:7px;font-size:12.5px;color:var(--ink-2)}
.pager button.on{background:var(--pri-2);border-color:var(--pri-2);color:#fff;font-weight:700}
.pager button:disabled{opacity:.4;cursor:default}
.empty{padding:54px 16px;text-align:center;color:var(--mute)}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tabs button{height:38px;padding:0 20px;background:#f0f1f6;border:0;border-radius:var(--r-s);color:var(--ink-2);font-size:13.5px;font-weight:500}
.tabs button.on{background:var(--pri-2);color:#fff;font-weight:700}
.utabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
.utabs button{background:0;border:1px solid transparent;border-bottom:0;padding:10px 18px;border-radius:8px 8px 0 0;color:var(--mute);font-size:13.5px;margin-bottom:-1px}
.utabs button.on{background:#fff;border-color:var(--line);color:var(--pri);font-weight:700}
.sums{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}
.sum{padding:15px 18px;border-radius:var(--r);background:#f1f3fb}
.sum.v{background:#f0effd}.sum.g{background:#e9faf2}
.sum .k{font-size:12.5px;color:var(--ink-2);font-weight:500}
.sum .v2{font-size:21px;font-weight:700;margin-top:3px;letter-spacing:-.3px}
.sum.g .v2{color:var(--green)}

/* forms */
.f-sec{padding:20px 24px;margin-bottom:14px}
.f-sec h3{font-size:16px;font-weight:700;margin-bottom:14px}
.frow{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:start;padding:7px 0}
.frow>label{font-weight:600;font-size:13px;padding-top:9px;color:var(--ink)}
.req{color:var(--red);margin-left:3px}
.fctl{min-width:0;max-width:760px}
.fctl .inp:not(.u){width:100%}
.ta{width:100%;min-height:88px;padding:10px 11px;border:1px solid var(--line-2);border-radius:var(--r-s);background:#fff;resize:vertical;font-size:13.5px;display:block}
.hint{font-size:11.5px;color:var(--mute);margin-top:5px}
.err{font-size:12px;color:var(--red);margin-top:5px}
.bad{border-color:var(--red)!important}
.line{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.line .unit{color:var(--mute);font-size:13px}
.cascade{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cascade select{flex:1;min-width:120px}
.radios{display:flex;gap:16px;flex-wrap:wrap;padding-top:8px}
.radios label,.chk{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;cursor:pointer}
.radios input,.chk input{accent-color:var(--pri);width:16px;height:16px;margin:0}
.switch{width:40px;height:22px;border-radius:99px;background:var(--line-2);border:0;position:relative;padding:0;vertical-align:middle;transition:.15s}
.switch::after{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch.on{background:var(--pri-2)}.switch.on::after{left:20px}
.switch:disabled{opacity:.55;cursor:default}
.up{border:1px dashed var(--line-2);border-radius:var(--r-s);padding:14px;display:flex;align-items:center;gap:10px;color:var(--mute);font-size:13px;flex-wrap:wrap}
.foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 0 4px;flex-wrap:wrap}
.foot .btn{min-width:96px}
.rte{border:1px solid var(--line-2);border-radius:var(--r-s);overflow:hidden}
.rte .bar{display:flex;gap:4px;padding:7px 9px;background:var(--th);border-bottom:1px solid var(--line);color:var(--ink-2);font-size:13px;flex-wrap:wrap}
.rte .bar span{padding:1px 8px;border-radius:5px;background:#fff;border:1px solid var(--line)}
.rte .ta{border:0;border-radius:0;min-height:190px}
.notice{display:flex;gap:9px;align-items:center;padding:11px 15px;background:var(--pri-weak);border-radius:var(--r-s);color:#4546c9;font-size:13px;margin-bottom:14px;flex-wrap:wrap}
.chart{width:100%;max-width:820px;height:auto;display:block;margin:0 auto}
.bar-r{display:grid;grid-template-columns:24px 150px 1fr 74px;gap:10px;align-items:center;padding:8px 0;font-size:13px}
.bar-r .tr{height:12px;background:#f0f1f6;border-radius:99px;overflow:hidden}
.bar-r .tr i{display:block;height:100%;background:var(--pri-2);border-radius:99px}
.ext{display:flex;gap:16px;padding:24px;flex-wrap:wrap}
.ext .big{width:48px;height:48px;border-radius:12px;background:var(--pri-weak);color:var(--pri);display:grid;place-items:center;flex:none}
.deny{max-width:440px;margin:80px auto;text-align:center;padding:38px 24px}
.deny .big{width:56px;height:56px;border-radius:50%;background:var(--amber-weak);color:var(--amber);display:grid;place-items:center;margin:0 auto 14px}
.deny h2{font-size:18px;margin-bottom:6px}

/* store design */
.bd{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.bd-p{position:sticky;top:84px;max-height:calc(100vh - 100px);overflow-y:auto}
.bd-p .c-h h3{font-size:16px;font-weight:700}

 <div class="tbl-wrap"><table class="dt"><thead><tr><th style="width:40px"></th><th>상품</th><th>옵션</th><th>자체 상품코드</th><th>재고</th><th>상태</th><th>판매상태</th></tr></thead><tbody>${view.map(x=>{const key=`${x.g['상품코드']}|${x.k}`;return `<tr><td>${ro?'':`<input type="checkbox" data-gsck="${esc(key)}" ${GSQ.ck.has(key)?'checked':''} aria-label="선택">`}</td><td class="l"><div class="gpi"><span class="gimg sm" style="background:${x.g._img}"></span><div><b>${esc(x.g['상품정보'])}</b><div class="sub">${esc(x.g['상품코드'])}</div></div></div></td><td>${esc(x.o.name)}</td><td class="tnum">${esc(x.o.sku)}</td><td><input class="inp gstk ${x.o.stock<=LOW_STOCK?'low':''}" type="number" min="0" value="${x.o.stock}" data-gstk="${esc(key)}" aria-label="재고" ${ro?'disabled':''}></td><td><span class="pill ${pill[x.st]}">${x.st}</span></td><td><span class="pill ${PILL[x.g['판매상태']]||''}">${x.g['판매상태']}</span></td></tr>`;}).join('')||'<tr><td colspan="7"><div class="empty">조건에 맞는 옵션이 없습니다.</div></td></tr>'}</tbody></table></div>
 ${pages>1?`<div class="pager"><button data-gspg="${GSQ.page-1}" ${GSQ.page===1?'disabled':''} aria-label="이전">‹</button>${win.map(p=>`<button data-gspg="${p}" class="${p===GSQ.page?'on':''}">${p}</button>`).join('')}<button data-gspg="${GSQ.page+1}" ${GSQ.page===pages?'disabled':''} aria-label="다음">›</button></div>`:''}</div>`;

const TS={};let CUR=null;
function st(id){return TS[id]||(TS[id]={page:1,q:'',sel:{...((S[id].defaults||{}).sel||{})},from:(S[id].defaults||{}).from||'',to:(S[id].defaults||{}).to||'',tab:0,checked:new Set(),quick:''});}
function rowsOf(s,id){
 const key=id+(s.tabs?'#'+st(id).tab:'');
 if(s.data){const r=s.data();r.forEach((x,i)=>{if(x._id==null)x._id=key+'-'+i+Math.random().toString(36).slice(2,6);});return r;}
 return db('gen:'+key,()=>{const n=Math.min(s.total||8,300),out=[];for(let i=1;i<=n;i++){const r={_id:key+'-'+i};s.cols.forEach(c=>{r[c]=cellFor(c,i+(st(id).tab*3));if(/일$|일시/.test(c)&&/^\d{4}\./.test(String(r[c])))r._date=String(r[c]).slice(0,10).replace(/\./g,'-');});if(c0(s,'번호'))r['번호']=n-i+1;out.push(r);}return out;});
}
function c0(s,l){return s.cols.includes(l);}
function filtered(s,id){
 const t=st(id);let r=rowsOf(s,id);
 if(s.tabFilter)r=r.filter(x=>s.tabFilter(x,t.tab));
 (s.filters||[]).forEach(f=>{if(f.type!=='sel'||!f.col)return;const v=t.sel[f.col];if(v&&v!=='전체')r=r.filter(x=>String(x[f.col])===v);});
 if(t.from)r=r.filter(x=>!x._date||x._date>=t.from);
 if(t.to)r=r.filter(x=>!x._date||x._date<=t.to);
 if(t.q){const q=t.q.toLowerCase();r=r.filter(x=>s.cols.some(c=>String(x[c]==null?'':x[c]).toLowerCase().includes(q)));}
 return r;
}
function isFiltered(s,id){const t=st(id);return t.q||t.from||t.to||Object.values(t.sel).some(v=>v&&v!=='전체');}

function tableHtml(s,id){

 const win=[];let a=Math.max(1,t.page-2),b=Math.min(pages,a+4);a=Math.max(1,b-4);for(let i=a;i<=b;i++)win.push(i);

 const ss=t.closest('[data-sseg]');if(ss){statSeg[CUR]=ss.dataset.sseg;renderView();return;}
 if(t.closest('[data-reset]')){askReason('통계 초기화','초기화 사유',()=>toast('통계를 초기화했습니다'));return;}
 if(t.closest('[data-file]')){toast('파일 첨부는 실제 업로드되지 않습니다');return;}
 if(t.closest('[data-smslog]')){toast('문자 발송 내역은 개발 단계에서 연동합니다');return;}
 if(t.closest('[data-ipadd]')){const b=t.closest('[data-ipadd]'),inp=b.parentElement.querySelector('input'),v=inp.value.trim();if(!/^\d{1,3}(\.\d{1,3}){3}$/.test(v)){toast('IP 형식을 확인하세요');return;}b.closest('.fctl').querySelector('[data-ips]').insertAdjacentHTML('beforeend',`<span class="pill p-violet">${esc(v)}</span>`);inp.value='';return;}
 const sw=t.closest('[data-switch]');if(sw){sw.classList.toggle('on');return;}
 const rule=t.closest('[data-rule]');if(rule){const c=document.querySelector(`[data-rt="${CSS.escape(rule.dataset.rule)}"]`);openModal('문구 편집 · '+rule.dataset.rule,`<textarea class="ta" id="ruleV">${esc(c.textContent)}</textarea><p class="hint">치환변수: [고객명] [주문번호] [상품명] [금액]</p>`,[{label:'취소'},{label:'적용',cls:'pri',keep:()=>{c.textContent=document.getElementById('ruleV').value;}}]);return;}
 const ft=t.closest('[data-ftab]');if(ft){showFTab(ft.dataset.ftab);return;}
 const sv=t.closest('[data-save]');if(sv){submitForm(sv);return;}
 if(!CUR)return;
 const s=S[CUR],id=CUR,ts=TS[id]||st(id);
 const tb=t.closest('[data-tab]');if(tb){ts.tab=+tb.dataset.tab;ts.page=1;ts.checked.clear();renderView();return;}
 const pg=t.closest('[data-pg]');if(pg){if(pg.disabled)return;ts.page=+pg.dataset.pg;refresh();return;}
 if(t.closest('[data-search]')){applyFilters(id);return;}
 const qk=t.closest('[data-quick]');if(qk){const k=qk.dataset.quick;ts.quick=k;if(k==='오늘'){ts.from=ts.to=TODAY;}else if(k==='7일'){ts.from=addDays(TODAY,-6);ts.to=TODAY;}else if(k==='30일'){ts.from=addDays(TODAY,-29);ts.to=TODAY;}else if(k==='이번달'){ts.from='2026-11-01';ts.to='2026-11-30';}else{ts.from='2026-10-01';ts.to='2026-10-31';}ts.page=1;renderView();return;}
 const tl=t.closest('[data-tool]');if(tl){const a=s.actions[+tl.dataset.tool],rows=[...ts.checked].map(r=>findRow(s,id,r)).filter(Boolean);if(a[2])a[2](rows);else if(a[1]==='xl'||/엑셀다운/.test(a[0]))excel(s,id);else if(/삭제/.test(a[0]))bulkDelete(rows);else if(/추가|등록|글쓰기/.test(a[0]))createModal(s,id,a[0]);else if(/초기화/.test(a[0]))confirmBox('목록을 초기화할까요?',()=>{rowsOf(s,id).length=0;refresh();});else if(/일괄/.test(a[0])){if(!rows.length)toast('항목을 선택하세요');else toast(rows.length+'건을 수정했습니다');}else toast(a[0]+' 완료');return;}
 const ra=t.closest('[data-ra]');if(ra){const row=findRow(s,id,ra.dataset.r),acts=s.rowActs||[{fn:r=>recordModal(r,s,id,true)},{fn:r=>delRow(r)}];if(row)acts[+ra.dataset.ra].fn(row);return;}
 if(t.closest('[data-all]')){const on=t.checked;document.querySelectorAll('[data-ck]').forEach(c=>{c.checked=on;on?ts.checked.add(c.dataset.ck):ts.checked.delete(c.dataset.ck);});return;}
 const ck=t.closest('[data-ck]');if(ck){ck.checked?ts.checked.add(ck.dataset.ck):ts.checked.delete(ck.dataset.ck);return;}
 const tr=t.closest('tr[data-rid]');if(tr&&!t.closest('button,a,input,select')){const row=findRow(s,id,tr.dataset.rid);if(row)(s.detail||(r=>recordModal(r,s,id)))(row);}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(modalEl)closeModal();else closeDrawer();document.querySelectorAll('.pop').forEach(p=>p.hidden=true);}if(e.key==='Enter'&&e.target.matches&&e.target.matches('[data-q]')&&CUR)applyFilters(CUR);});
function applyFilters(id){
 const ts=st(id),root=document.getElementById('view');
 root.querySelectorAll('[data-sel]').forEach(el=>ts.sel[el.dataset.sel]=el.value);
 const q=root.querySelector('[data-q]');if(q)ts.q=q.value.trim();
 const f=root.querySelector('[data-from]'),to=root.querySelector('[data-to]');if(f){ts.from=f.value;ts.to=to.value;ts.quick='';}
 ts.page=1;ts.checked.clear();refresh();
}
window.addEventListener('hashchange',route);
window.addEventListener('resize',()=>{if(window.innerWidth>900)document.body.classList.remove('drawer');});
route();
</script>
</body>
</html>
